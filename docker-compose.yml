services:
  mysql:
    image: mysql:8.4
    container_name: ums-mysql
    environment:
      MYSQL_DATABASE: ums
      MYSQL_USER: ums
      MYSQL_PASSWORD: ums
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ums-mysql:/var/lib/mysql

  postgres:
    image: postgres:16-alpine
    container_name: ums-postgres
    environment:
      POSTGRES_USER: ums
      POSTGRES_PASSWORD: ums
      POSTGRES_DB: postgres
    ports:
      - "5435:5432"
    volumes:
      - ums-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ums -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ums-mysql:
  ums-postgres:
